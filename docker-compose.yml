version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: nagriklink-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: nagriklink
    ports:
      - "5432:5432"
    volumes:
      - nagriklink_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d nagriklink"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  nagriklink_pg_data:
    driver: local
